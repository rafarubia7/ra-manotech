<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RA Esteira - MetalTech</title>
  <!-- ?v=N força o celular a baixar a versão nova (aumente N a cada publicação) -->
  <link rel="stylesheet" href="./css/style.css?v=4">

  <!-- A-Frame e MindAR (mesmas versões vistas em aula) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- Selo visível enquanto MODO_TESTE = true (js/config.js) -->
  <div id="selo-teste" class="selo-teste" hidden>⚠ DADOS DE TESTE (SIMULADOS)</div>

  <!-- Mensagem de status (procurando alvo, erros) -->
  <div id="status" class="status">Aponte a câmera para a esteira…</div>

  <!-- Painéis sobrepostos à câmera: aparecem só com a esteira detectada -->
  <!-- Arraste os cards com o dedo para mudar de lugar -->
  <main id="paineis" class="paineis" hidden>
    <button id="btn-organizar" class="btn-organizar" type="button">↺ Organizar</button>

    <section id="card-contagem" class="card" aria-label="Contagem de peças">
      <h2>Contagem de peças</h2>
      <ul class="contagem">
        <li><span>Metálicas</span><strong id="qtd-metalicas">--</strong></li>
        <li><span>Não metálicas</span><strong id="qtd-nao-metalicas">--</strong></li>
        <li class="total"><span>Total</span><strong id="qtd-total">--</strong></li>
      </ul>
    </section>

    <section id="card-nivel" class="card nivel-normal" aria-label="Nível do reservatório">
      <h2>Nível do reservatório</h2>
      <p class="nivel-valor"><strong id="nivel-valor">--</strong>%</p>
      <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="nivel-barra-container">
        <div id="nivel-barra" class="barra-preenchimento"></div>
      </div>
      <p id="nivel-alerta" class="nivel-alerta">--</p>
    </section>
  </main>

  <!-- Cena de RA: reconhece a esteira real a partir de foto(s) dela (assets/target.mind).
       warmupTolerance baixo = reconhece mais rápido;
       missTolerance alto = não "perde" a esteira por qualquer tremida. -->
  <a-scene
    id="cena"
    mindar-image="imageTargetSrc: ./assets/target.mind; uiScanning: no; uiLoading: yes; uiError: no; warmupTolerance: 2; missTolerance: 15"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Alvos: uma entidade por foto da esteira compilada no target.mind.
         Se compilar mais fotos (ângulos diferentes), adicione targetIndex: 1, 2... -->
    <a-entity class="alvo" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script src="./js/config.js?v=4"></script>
  <script src="./js/dados.js?v=4"></script>
  <script src="./js/arrastar.js?v=4"></script>
  <script src="./js/main.js?v=4"></script>
</body>
</html>
