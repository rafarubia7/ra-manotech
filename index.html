<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RA Esteira - MetalTech</title>
  <link rel="stylesheet" href="./css/style.css">

  <!-- A-Frame e MindAR (mesmas versões vistas em aula) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <!-- Mensagem de status (procurando alvo, erros) -->
  <div id="status" class="status">Aponte a câmera para a imagem da esteira…</div>

  <!-- Painéis sobrepostos à câmera: aparecem só com a esteira detectada -->
  <main id="paineis" class="paineis" hidden>
    <section class="card" aria-label="Contagem de peças">
      <h2>Contagem de peças</h2>
      <ul class="contagem">
        <li><span>Metálicas</span><strong id="qtd-metalicas">--</strong></li>
        <li><span>Não metálicas</span><strong id="qtd-nao-metalicas">--</strong></li>
        <li class="total"><span>Total</span><strong id="qtd-total">--</strong></li>
      </ul>
    </section>

    <section class="card" aria-label="Nível do reservatório">
      <h2>Nível do reservatório</h2>
      <p class="nivel-valor"><strong id="nivel-valor">--</strong>%</p>
      <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="nivel-barra-container">
        <div id="nivel-barra" class="barra-preenchimento"></div>
      </div>
      <p id="nivel-alerta" class="nivel-alerta">--</p>
    </section>
  </main>

  <!-- Cena de RA: reconhece a foto da esteira (assets/target.mind) -->
  <a-scene
    id="cena"
    mindar-image="imageTargetSrc: ./assets/target.mind; uiScanning: no; uiLoading: yes; uiError: no"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Alvo: a imagem da esteira -->
    <a-entity id="alvo" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script src="./js/main.js"></script>
</body>
</html>
